<!DOCTYPE html>
<html lang="en" class="sc-preload">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scaredy Cat</title>
  <link rel="preload" href="../fonts/Inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../fonts/BricolageGrotesque.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <span class="logo-icon" aria-hidden="true">🙀</span>
        <h1 class="logo-text">Scaredy Cat</h1>
      </div>
      <label class="toggle-switch">
        <input type="checkbox" id="enableToggle" class="toggle-input" checked aria-label="Scaredy Cat on or off">
        <span class="toggle-slider" aria-hidden="true"></span>
      </label>
    </header>

    <!-- Status — the plum band, the popup's one high-contrast moment -->
    <section class="status-card" id="statusCard" aria-live="polite">
      <span class="status-count" id="blockedCount">0</span>
      <div class="status-info">
        <span class="status-label" id="statusLabel">All clear on this page</span>
        <span class="status-total"><strong id="totalBlocked">0</strong> hidden all time</span>
      </div>
    </section>

    <!-- Sensitivity Control -->
    <section class="control-section sensitivity-section" id="sensitivitySection">
      <div class="control-label">
        <span class="control-title" id="sensitivityKicker">Sensitivity</span>
        <span class="control-value" id="sensitivityValue">Medium</span>
      </div>
      <div class="sensitivity-buttons" role="group" aria-labelledby="sensitivityKicker">
        <button type="button" class="sensitivity-btn" data-value="low" aria-pressed="false">
          <span class="btn-icon" aria-hidden="true">😌</span>
          <span class="btn-label">Low</span>
        </button>
        <button type="button" class="sensitivity-btn active" data-value="medium" aria-pressed="true">
          <span class="btn-icon" aria-hidden="true">😟</span>
          <span class="btn-label">Medium</span>
        </button>
        <button type="button" class="sensitivity-btn" data-value="high" aria-pressed="false">
          <span class="btn-icon" aria-hidden="true">😱</span>
          <span class="btn-label">High</span>
        </button>
      </div>
      <p class="control-hint" id="sensitivityHint">Blocks content with 60%+ horror confidence</p>
    </section>

    <!-- Site Controls -->
    <section class="control-section">
      <button type="button" class="action-btn site-toggle" id="siteToggle">
        <span class="action-text">Pause on this site</span>
      </button>
    </section>

    <!-- Blocked Items (if any) -->
    <section class="control-section blocked-section" id="blockedSection" hidden>
      <div class="control-label">
        <span class="control-title">Hidden items</span>
        <button type="button" class="text-btn" id="showAllBtn">Show all</button>
      </div>
      <ul class="blocked-list" id="blockedList">
        <!-- Dynamically populated -->
      </ul>
    </section>

    <!-- Feedback -->
    <section class="control-section feedback-section">
      <div class="control-label">
        <span class="control-title">Feedback</span>
        <button type="button" class="text-btn" id="sendFeedbackBtn" aria-expanded="false" aria-controls="feedbackForm">Send a note</button>
      </div>
      <button type="button" class="action-btn" id="reportMissedBtn">
        <span class="action-text">Report missed horror</span>
      </button>

      <form class="feedback-form" id="feedbackForm" hidden>
        <div class="feedback-cats" role="group" aria-label="Feedback category">
          <button type="button" class="feedback-cat active" data-cat="bug" aria-pressed="true">Bug</button>
          <button type="button" class="feedback-cat" data-cat="idea" aria-pressed="false">Idea</button>
          <button type="button" class="feedback-cat" data-cat="praise" aria-pressed="false">Praise</button>
          <button type="button" class="feedback-cat" data-cat="other" aria-pressed="false">Other</button>
        </div>
        <textarea id="feedbackText" class="feedback-text" rows="3"
          placeholder="Tell the cat what's on your mind…" aria-label="Your note"></textarea>
        <input type="email" id="feedbackEmail" class="feedback-email"
          placeholder="Email (optional, if you'd like a reply)" aria-label="Email, optional">

        <div class="feedback-consent-row" id="popupConsentRow" hidden>
          <p class="feedback-consent-text">
            We'll send your note plus the extension version — no images, no browsing history.
          </p>
          <div class="feedback-consent-actions">
            <button type="button" class="feedback-cat" id="popupConsentDecline">Not now</button>
            <button type="button" class="feedback-cat active" id="popupConsentAccept">Share &amp; send</button>
          </div>
        </div>

        <button type="submit" class="action-btn action-btn--primary feedback-submit" id="feedbackSubmit">Send</button>
        <p class="feedback-status" id="feedbackStatus" role="status" aria-live="polite"></p>
      </form>

      <label class="feedback-toggle-row toggle-switch toggle-switch--sm">
        <span class="feedback-toggle-label">Share reports to improve detection</span>
        <input type="checkbox" id="feedbackConsentToggle" class="toggle-input">
        <span class="toggle-slider" aria-hidden="true"></span>
      </label>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <p class="footer-text">Keeping you safe from spooky stuff! 👻</p>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
